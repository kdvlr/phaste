[project]
name = "phaste"
version = "0.1.0"
description = "Paste in haste - instant self-hosted multimodal capture and search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.5",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "pillow>=10.4.0",
    "pytesseract>=0.3.13",
    "reverse_geocoder>=1.5.1",
    "yt-dlp>=2024.08.06",
    "python-multipart>=0.0.12",
    "numpy>=1.26.4",
    "onnxruntime>=1.19.2",
    "tokenizers>=0.20.0",
    "aiofiles>=24.1.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
